<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Curious Agent Studio">
<style>
  :root { --bg:#f6f4f1; --ink:#1d1b19; --muted:#6b645c; --line:#dcd6ce; --ok:#2e7d4f; --bad:#b23a3a; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#171513; --ink:#ece7e1; --muted:#a39a90; --line:#35302b; --ok:#7fcf9e; --bad:#ef8f8f; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         padding: calc(24px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); }
  main { max-width: 560px; margin: 0 auto; display:flex; flex-direction:column; gap:24px; }
  h1 { font-size:1.6rem; margin:0; }
  .muted { color:var(--muted); font-size:.92rem; margin:0; }
  section { border-top:1px solid var(--line); padding-top:16px; display:flex; flex-direction:column; gap:10px; }
  h2 { font-size:1rem; margin:0; }
  dl { display:grid; grid-template-columns: auto 1fr; gap:6px 16px; margin:0; }
  dt { color:var(--muted); } dd { margin:0; font-variant-numeric: tabular-nums; }
  .buttons { display:flex; flex-wrap:wrap; gap:8px; }
  button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; }
  button:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  pre { margin:0; white-space:pre-wrap; font-size:.9rem; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Curious Agent Studio</h1>
    <p class="muted">A first test. It reads one agent's settings from GitHub and changes nothing.</p>
  </header>

  <section aria-labelledby="agent-h">
    <h2 id="agent-h">Agent</h2>
    <p id="agent-status" class="muted">Reading the profile…</p>
    <dl id="agent-settings" hidden></dl>
  </section>

  <section aria-labelledby="wait-h">
    <h2 id="wait-h">How long can one request run?</h2>
    <p class="muted">Each button asks the server to wait that long. The longest that comes back is the limit on this plan.</p>
    <div class="buttons">
      <button type="button" data-s="10">10 s</button>
      <button type="button" data-s="30">30 s</button>
      <button type="button" data-s="60">60 s</button>
      <button type="button" data-s="120">120 s</button>
      <button type="button" data-s="300">300 s</button>
    </div>
    <pre id="wait-log" aria-live="polite"></pre>
  </section>
</main>
<script>
const LABELS = {agent_name:"Name", model_name:"Model", monthly_limit:"Monthly limit ($)", dress_rehearsal:"Dress rehearsal"};

fetch("/api/profile", {cache:"no-store"})
  .then(r => r.json().then(body => ({ok:r.ok, body})))
  .then(({ok, body}) => {
    const status = document.getElementById("agent-status");
    if (!ok) { status.textContent = body.error || "Something went wrong."; status.className = "bad"; return; }
    status.textContent = "Read from " + body.repository + ".";
    status.className = "ok";
    const dl = document.getElementById("agent-settings");
    for (const [k, v] of Object.entries(body.settings)) {
      const dt = document.createElement("dt"); dt.textContent = LABELS[k] || k;
      const dd = document.createElement("dd"); dd.textContent = v == null ? "(not set)" : v;
      dl.append(dt, dd);
    }
    dl.hidden = false;
  })
  .catch(() => {
    const status = document.getElementById("agent-status");
    status.textContent = "Could not reach the server function.";
    status.className = "bad";
  });

const log = document.getElementById("wait-log");
document.querySelectorAll("button[data-s]").forEach(b => b.addEventListener("click", () => {
  const s = b.dataset.s, t0 = performance.now();
  log.textContent += `Asked for ${s} s… `;
  fetch("/api/wait?seconds=" + s, {cache:"no-store"})
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(body => { log.textContent += `came back after ${body.waited} s.\n`; })
    .catch(code => { log.textContent += `stopped after ${((performance.now()-t0)/1000).toFixed(1)} s (${code}).\n`; });
}));
</script>
</body>
</html>
